<!DOCTYPE html>
<html>
<head>
    <title>OnChain Study Notes</title>
</head>
<body>
    <h1>OnChain Study Notes</h1>

    <button id="connectBtn">Connect Wallet</button>

    <h3>Save Your Study Note</h3>
    <input type="text" id="noteInput"
           placeholder="Enter your study note">

    <button id="saveBtn">Save Note</button>
    <button id="viewBtn">View Note</button>
    <button id="clearBtn">Clear Note</button>

    <p id="status">Wallet not connected</p>
    <p id="displayNote"></p>

    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
